# Builds the signed DMG.
#   push a tag vX.Y.Z    build, check the tag matches Info.plist, publish a GitHub release
#                        (the annotated tag's message becomes the release notes)
#   run manually         build only, the DMG is attached to the run as an artifact (a dry run)
#
# Secrets: CERT_P12_BASE64 and CERT_P12_PASSWORD, the "Moody Dimmer Local Signing" certificate exported
# with its key. Every release is signed with the same certificate, so macOS keeps Accessibility access
# across updates. See docs/building.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $VERSION in Resources/Info.plist"
            exit 1
          fi

      - name: Import the signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a prompt, and search this keychain first.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build
        run: ./scripts/build-app.sh

      - name: Check the signature
        run: |
          DMG="$(ls build/MoodyDimmer-*.dmg)"
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -quiet "$DMG" -mountpoint "$MOUNT"
          codesign --verify --strict "$MOUNT/Moody Dimmer.app"
          codesign -dvv "$MOUNT/Moody Dimmer.app" 2>&1 | grep -q "Authority=Moody Dimmer Local Signing" \
            || { echo "::error::The app isn't signed with Moody Dimmer Local Signing"; exit 1; }
          hdiutil detach -quiet "$MOUNT"
          shasum -a 256 "$DMG"

      - name: Attach the DMG to the run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: build/MoodyDimmer-*.dmg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout has the tagged commit, not the tag object with its message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" build/MoodyDimmer-*.dmg --verify-tag \
            --title "Moody Dimmer ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
